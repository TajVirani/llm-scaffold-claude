# File: the project's model table, .workflow/model-map.yaml: one row per sub-agent task type. Project-owned.
# Read by .agents/skills/feature-workflow/scripts/resolve-launch.sh at every launch: the model for a launch is <task type>.<host>.
#   A missing row or host value, or one still holding a <...> placeholder, denies the launch with 00.14.
# Seeded by project-setup from .agents/skills/project-setup/assets/model-map.yaml. install.sh writes it only when it converts
#   an older install's one-file-per-type folder, .workflow/model-map/<type>.md, into this file.
# Keys per row:
#   tier: cheap | strong
#   claude: a Claude Code alias (haiku | sonnet | opus), never a dated model ID
#   codex: a Codex model name (cheap gpt-6-luna, strong gpt-6-sol); Codex retires names, so check them with `codex debug models`
#   why: one sentence on why this tier fits the task type
#   observations: optional list, appended at 5.7 by the retrospective with the stakeholder's approval, one dated line each:
#     "<YYYY-MM-DD> (<host> <alias>, spec <NNN-slug>): <what happened>. <the alias change, or No alias change.>"
fact-lookup:
  tier: cheap
  claude: haiku
  codex: gpt-6-luna
  why: Bounded reading or checking task with a fixed return format; a fast, low-cost model is enough, and the strong tier is kept for writing and judging code.
implementation:
  tier: strong
  claude: opus
  codex: gpt-6-sol
  why: Writes or judges code across files, where a wrong call costs a rework loop; uses the strongest model.
  observations:
    - '2026-10-22 (claude opus, spec 002-review-lessons): six tasks done; every rework and fix round converged in one launch; T3 returned profile-wrong correctly on a lint key another task''s pin had turned red. No change.'
    - '2026-10-26 (claude, spec 003-bash-cache-extractor): T9 and T10 passed in one launch each; T3 rework 2 took three rounds (one behaviour fix for a continued line after an operator, two for missing reason comments on new parsing clauses), and the agent itself caught a first fix that added about 100 false edges on this repo. No alias change.'
    - '2026-10-30 (claude, spec 008-pr-description-template): T4 built beyond its task file (a 5.5 hash check and a separate PR-description approval; the stakeholder removed one and kept the other, D17, D18); T2 was resumed once to add tests for behaviour beyond Phase 1; T1 needed one behaviour fix round. No alias change.'
    - '2026-11-02 (claude, spec 009-slim-workflow-context): wrote `self_review[].item` as a quoted string in T1 and T2 (wave 1) and again in T1, T9 and T10 (rework 1), each fixed in one resume (backlog B2); every rework converged in one launch. No alias change.'
    - '2026-11-03 (claude opus, spec 00014-tracker-issue-spec-ids): 10 tasks; 3 behaviour fix rounds (T3, T5, T8) and 5 wording rounds, each converging in one launch; wave-1 agents (T1, T2, T3) wrote quoted `self_review[].item` until the brief named the unquoted form; T8 first skipped negative tests ("tests/ is outside the module") and added 16 on one resume. No alias change.'
