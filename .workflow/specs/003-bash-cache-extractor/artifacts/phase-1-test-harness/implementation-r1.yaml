  - kind: decision
    summary: "The spec says the generator frontmatter names the extractors that ran, but no interface gives that name to the caller. The harness assumes build-architecture.sh --print-generator prints the sorted, comma-joined names (none left out) and exits 0."
    evidence: "tests/scripts/cache-mixed-extractors.sh, JRN-004 generator names bash,dependency-cruiser; data-model.md Tier B frontmatter generator"
    blocker_assessment: can-wait
    reason: "It is needed by the implementing task, which can take the assumed flag or have the test changed when tasks are written."
  - kind: decision
    summary: "Architecture bullets need `file:line` for each unresolved edge, but the Graph JSON contract has no field for the line number. The harness checks the line only in the rendered architecture.md, not in the extractor JSON."
    evidence: "data-model.md Graph JSON (no line field); tests/scripts/cache-bash-project.sh, JRN-001 the dynamic source is listed with its file, line and source text"
    blocker_assessment: can-wait
    reason: "The implementer can add an optional field such as `line`; it needs recording in the data model, not a decision before Phase 2."
  - kind: requirement
    summary: "shell-scripts profile File locations says skill script depth stops at scripts/<file> with no subfolders, which conflicts with the agreed extractors/ subfolder."
    evidence: ".workflow/profiles/shell-scripts.md File locations: \"Depth stops at `.agents/skills/<s>/scripts/<file>`: no subfolders.\"; .agents/skills/regenerate-caches/scripts/extractors/"
    blocker_assessment: can-wait
    reason: "Lint globs still match the subfolder; the profile wording can be fixed through proposals.md at 5.3."
  - kind: bug
    summary: "This repo's .workflow/profiles/TEMPLATE.md has no graph_extractor key. If profile resolution reads every *.md in the profiles folder, the 5.3 build fails on the template unless it is skipped or given the key."
    evidence: ".workflow/profiles/TEMPLATE.md"
    blocker_assessment: can-wait
    reason: "It only matters when the reader is built and run on this repo at 5.3."
