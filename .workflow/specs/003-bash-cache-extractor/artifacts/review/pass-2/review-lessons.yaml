    claim: "Repeats the pitfall 'Report a detected call as unresolved; never filter it out': a source or dot line whose target has no slash and no .sh suffix (for example `source lib`) is dropped, not reported as couldNotResolve."
    consequence: "For whoever reads the architecture cache: a sourced file the extractor cannot resolve is missing from the module graph and from the Unresolved edges section, so the cache reports no unresolved dependency where the script has one."
    evidence:
      basis: "pitfalls.md 'Report a detected call as unresolved; never filter it out' (its What happened names dropped extensionless targets); bash.sh header line 5: each source or dot line is an edge."
      diff: "    if (target ~ /^[$\\034]/) add_edge(target, 1)\n    else if (target ~ /\\// || target ~ /\\.sh$/) add_edge(target, 0)"
    suggested_fix: "Call add_edge(target, 0) for any other non-empty target so it is reported as unresolved; add a bare `source lib` line to the bash fixture and a case to tests/scripts/extractor-bash.sh. Then record it as a review lesson at the next 5.7."
  - id: RL-2
    category: lesson
    severity: medium
    confidence: 80
    location: ".agents/skills/regenerate-caches/scripts/extractors/bash.sh:145 and :331"
    claim: "Repeats the pitfall 'Report a detected call as unresolved; never filter it out' for cwd-relative paths: a command whose first word is a relative path with a slash but no leading ./ (for example `scripts/build-docs.sh`) is skipped, because only ./ and ../ words reach the cwd-relative check."
    consequence: "A script run relative to the working directory, which the header says is always couldNotResolve, is absent from Unresolved edges and from the module graph, so the cache hides a call whose target depends on where the job runs."
    evidence:
      basis: "pitfalls.md 'Report a detected call as unresolved; never filter it out' (its What happened lists cwd-relative paths as dropped); bash.sh header lines 6-7: a script run by a path relative to the working directory is always couldNotResolve."
      diff: "    if (token !~ /^[$\\034]/) continue\n    if (words[1] ~ /^\\.\\.?\\/[^\\/]/) script = words[1]"
    suggested_fix: "In report_cwd_relative_calls, accept a first word that contains a slash and does not start with $, / or ~ as the script, as the bash and sh branch already does; add a bare `scripts/x.sh` command line to the bash fixture and the extractor-bash suite."
