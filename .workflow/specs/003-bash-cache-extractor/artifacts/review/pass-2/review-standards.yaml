findings:
  - id: RS-1
    category: smell
    severity: medium
    confidence: 80
    location: ".agents/skills/regenerate-caches/scripts/build-architecture.sh:154-163,543-551"
    claim: "Possible Duplicated Code: profile_extractors and test_patterns each repeat the same walk over the work profiles: the same glob, the same TEMPLATE.md skip, the same toolchain_block call, the same yq tag probe and the same 'does not parse' die."
    consequence: "The rule for which files under the profiles folder count as work profiles now lives in two places in one script. If a later change skips another file there (an examples/ copy, a README.md), only one loop is likely to get the change. graph_extractor and test_patterns would then disagree about the profile set. For example, the extractor check would stop the build on a file that the test-pattern reader ignores."
    evidence:
      basis: "Smell baseline: Duplicated Code (the same logic shape appears in more than one hunk in the change)."
      diff: "+  for path in \"$root/$WF_PROFILES\"/*.md; do\n+    [[ -f \"$path\" && \"$(basename \"$path\")\" != TEMPLATE.md ]] || continue\n+      || die \"the Toolchain yaml block does not parse in $rel\""
    suggested_fix: "Extract one helper, for example work_profiles, that prints the profile paths to read (TEMPLATE.md skipped, the yq check done once), and have both functions loop over its output."
  - id: RS-2
    category: standard
    severity: low
    confidence: 85
    location: ".workflow/profiles/shell-scripts.md:49-52, .workflow/profiles/test-harness.md:39-42, .workflow/profiles/agent-docs.md:44-47"
    claim: "The new graph_extractor line sits between test_patterns and the two continuation comment lines that explain it. The default test-pattern list and 'A list replaces them for this profile' now read as notes on graph_extractor."
    consequence: "Every implementing agent gets the whole profile in its launch. A reader of the Toolchain block can take graph_extractor to accept a list or to have those defaults, and can lose the explanation of test_patterns. The project's own TEMPLATE.md keeps the test_patterns comment together and puts graph_extractor after serve_ready."
    evidence:
      basis: ".agents/skills/project-setup/assets/profiles/TEMPLATE.md:35 places graph_extractor after serve_ready, and :41-43 keeps the test_patterns line and its two '# [\"*.test.*\", ...]. A list replaces them' continuation lines together. readable-code.md R5: write plainly."
      diff: "+test_patterns: [\"tests/\"] # which paths are tests, kept out of the size-budget file count (budget-check.sh) and out of flow entry candidates. [] or absent: the defaults\n+graph_extractor: bash # the graph extractor the Tier B cache build runs for this work type: bash, dependency-cruiser or none\n                   # [\"*.test.*\", \"*.spec.*\", \"__tests__/\", \"tests/\", \"test/\", \"e2e/\", \"*_test.go\", \"test_*.py\", \"*_test.py\"]. A list replaces them"
    suggested_fix: "In each of the three profiles, move the graph_extractor line above test_patterns (after serve_ready, as in TEMPLATE.md) so the continuation comments follow test_patterns again."
  - id: RS-3
    category: discovered-work
    kind: decision
    summary: "The agents module depends on regenerate-caches and visual-change-report, but .workflow/rules.md lets agents depend on feature-workflow only. cache-regeneration.md runs regenerate-caches scripts and visual-change-report's validate_mermaid.mjs by skills/<name>/ path, and rules.md counts that as a dependency. This change adds more calls through the same $S path (build-architecture.sh --print-generator), but the dependency itself was already there."
    evidence: ".agents/agents/cache-regeneration.md:36 at baseline 86609a6 ('S=.agents/skills/regenerate-caches/scripts'), :85 and :88 (visual-change-report paths); .workflow/rules.md Ownership: 'agents: owns: [\".agents/agents/**\"] may_depend_on: [feature-workflow]' and 'a `source` line, a script call or a `skills/<name>/` path reference counts as a dependency.'"
    blocker_assessment: can-wait
    reason: "No boundary tool enforces the Ownership map here, and the agent has worked this way since before this spec. It needs a decision: either add regenerate-caches and standalone-skills to agents.may_depend_on, or change how the agent reaches the scripts. That decision is a change to rules.md, which is outside this feature."
