out_of_scope_noticed:
  - kind: bug
    summary: "The hand-finish command printed for a task issue that could not be filed gives the task file as a spec-relative path with no --cwd. issue-tracker.sh resolves a relative file against the current folder, so for a spec in a spec worktree, run from the main checkout as the command reads, it fails. The same command with an absolute path works."
    evidence: "probe 1 in a scratch main checkout, file present only in a separate folder: 'issue-tracker.sh: cannot read <scratch>/main/.workflow/specs/00101-beta/tasks/T02-wire.md' exit=2; same command with the absolute path: 'https://github.com/acme/proj/issues/202' exit=0. Code: tracker-adoption.sh:318 builds the command with $WF_SPECS/$new/${file}; issue-tracker.sh:88-93 absolute_path uses PWD. tests/scripts/tracker-adoption.sh:287-288 checks only that the text contains the task file name and never runs the command."
    blocker_assessment: blocks-this-task
    reason: "The line that prints the remedy for the one new failure is on lines this diff adds, and the remedy does not run as written for a spec in a spec worktree. Fix: print the absolute task file under the spec's post-rename root, and pass --cwd with the main checkout."
  - kind: bug
    summary: "A task whose issue was filed but whose record could not be written keeps no issue in its record, so the next run files a second tracker issue for that task. The header's claim (tracker-adoption.sh:20-21) that a second run files no second task issue holds only when the record write succeeds."
    evidence: "probe 2, scratch main checkout, a task record the tasks.md validator refuses: run 1 printed 'tracker-adoption.sh: filed https://github.com/acme/proj/issues/202 for task T1 of .workflow/specs/00101-beta, but cannot record it' and exit=1; 'gh create calls after run 1: 1'; 'tasks.md issue fields after run 1: none'; run 2 printed the same warning and 'gh create calls after run 2: 2'. Code: tracker-adoption.sh:314 selects records with no issue; 330-333 warns without recording the URL anywhere the next run reads."
    blocker_assessment: blocks-this-task
    reason: "Lines 314 and 330-333 and the header lines 20-21 are in this diff. The printed recovery is a hand set-task, but a rerun after the stderr's advice to fix the record and run again files a duplicate issue in the tracker. Fix options for the implementer: validate or fix the record before filing, or have a rerun reuse an issue the warning named."
  - kind: decision
    summary: "With no gh CLI installed, the new create-task call exits 2, and the run turns that into a per-task warning and exit 1. The create-spec call on the same condition dies with exit 2, so the two paths disagree on whether a missing CLI is an environment error."
    evidence: "probe 3, scratch main checkout with no gh on PATH: 'issue-tracker.sh: gh is not installed; it is needed to reach the github tracker', then 'tracker-adoption.sh: cannot file the issue of task T1 of .workflow/specs/00101-beta (issue-tracker.sh create-task exit 2); file it by hand ...', exit=1. Code: tracker-adoption.sh:323-329 (per-task warn) against tracker-adoption.sh:390 (create-spec exit 2 dies); # Exit: line 31 lists a missing tool as exit 2."
    blocker_assessment: blocks-this-task
    reason: "The choice between exit 1 per task and exit 2 for a missing CLI is for the owner to make; the lines that encode it are in this diff. The implementer's self_review item 'a bad task file is per task' does not cover a missing CLI."
