findings:
  - id: RS-1
    category: smell
    severity: medium
    confidence: 85
    location: ".agents/skills/issue-tracking/scripts/issue-tracker.sh:120-126,155; .agents/skills/issue-tracking/scripts/tracker-adoption.sh:333-356"
    claim: "Possible Primitive Obsession, still there after the rework 1 fix for pass-1 RS-2: the https-only rule for an issue URL is now checked by returned_issue_url only after the tracker has already created the issue. tracker-setup.sh check never tests the scheme, so setup accepts an http GitLab and then every create files an issue that is thrown away."
    consequence: "On a GitLab served over http, tracker-setup.sh check reports nothing wrong. After that, each 0.1.1 run of next-spec-number.sh files a real issue and exits 1, and each run of tracker-adoption.sh files one more issue for every active spec. Adoption then reports the spec as 'the tracker could not file its issue', which is false: the issue exists. The comment at tracker-adoption.sh:334 promises 'a second run files nothing twice', and that no longer holds. create-task does the same on both hosts (issue-tracker.sh:238, 284, 296). The stakeholder is left with issues on the tracker that no spec or task records."
    evidence:
      basis: "Primitive Obsession (smell baseline). The comment this breaks: tracker-adoption.sh:333-334 \"Its URL goes into tracker_issue at once, so a run that fails later still knows the issue and a second run files nothing twice.\""
      diff: "+    url=$(json_field \"the new issue's URL\" .web_url \"$answer\") || exit 1\n+  fi\n+  returned_issue_url \"$url\""
      reproduction: "Run in a scratch worktree of HEAD. The fixture repo has origin http://gitlab.example.com/g/p.git, GitLab settings, a draft spec 015-delta with tracker_issue \"\", and a stub glab on PATH that answers issue creates with {\"web_url\":\"http://gitlab.example.com/g/p/-/issues/<n>\",\"iid\":<n>} and logs each call. Running `next-spec-number.sh --cwd $P` twice printed `issue-tracker.sh: glab answered with the issue URL http://gitlab.example.com/g/p/-/issues/42, which is not https; only https trackers are supported` and then the same for issue 43, with exit=1 both times and `issue-create calls: 2`. Running `tracker-adoption.sh --cwd $P` twice printed `tracker-adoption.sh: refused .workflow/specs/015-delta: the tracker could not file its issue (issue-tracker.sh exit 1)` with exit=1 both times, and also `issue-create calls: 2`; spec.md still read `tracker_issue: \"\"`."
    suggested_fix: "Refuse an http tracker before creating anything: check the project's web URL scheme in tracker-setup.sh check (and in issue-tracker.sh before create-spec and create-task), so no issue is created that will then be refused. Failing that, record the returned URL before refusing it. Also make adoption's message say that an issue was filed."
