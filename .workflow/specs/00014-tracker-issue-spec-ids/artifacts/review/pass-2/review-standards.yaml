not_checked:
  - "typecheck, format and boundary are `skipped` (no command) in every task's toolchain.json. No tool covers them in this repo."
  - "Possible Duplicated Code: the https issue-URL rule still has five copies with slightly different shapes (issue-tracker.sh is_issue_url and returned_issue_url, next-spec-number.sh print_issue_number, tracker-adoption.sh ISSUE_URL_PATTERN, and status-transition.sh :171 and :330, which do not require a trailing number). They now agree on https, and every task issue is written from create-task output, which is already checked. I could name no caller that diverges, so this is below 80. A probe that writes a set-task --issue URL with no trailing number and then runs issue-tracker.sh move on it would settle whether the looser check matters."
