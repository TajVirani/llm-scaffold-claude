findings:
  - id: RS-1
    category: rule
    severity: medium
    confidence: 90
    location: "commits efd0c38, 131f786 (.agents/lib/workflow-paths.sh, integration batch integration-shell-scripts)"
    claim: "The two shared-core commits from the integration batch have subjects that are not Conventional Commits: 'Add WF_SPECS_DONE, the Done folder path (integration request 1)' and 'Let wf_norm_folder spec accept a Done folder child (integration request 2)'."
    consequence: "The sign-off merge is --no-ff, so both commits land on main as they are. They are the only code commits in the range outside the required form, the pr-quality commit-hygiene check will flag them as MEDIUM before merge, and anyone reading the lib history by type (feat/fix) will miss the WF_SPECS_DONE and wf_norm_folder changes. Earlier integration commits used the form (e.g. 'feat(lib): implement wf_enc and wf_agent_worktree_name (integration request 1)')."
    evidence:
      basis: ".workflow/rules.md Cross-cutting policy: \"Commit subjects are Conventional Commits (`feat:`, `fix:`, `docs:`, `chore:`, `test:`, `refactor:`).\" Also .workflow/pr-quality/commit-hygiene.md check A: \"Flag a subject that is not `<type>(<optional scope>): <summary>`\" (MEDIUM)."
      diff: "efd0c38 Add WF_SPECS_DONE, the Done folder path (integration request 1)\n131f786 Let wf_norm_folder spec accept a Done folder child (integration request 2)"
    suggested_fix: "Reword both subjects before sign-off, e.g. 'feat(lib): add WF_SPECS_DONE, the Done folder path (integration request 1)' and 'feat(lib): let wf_norm_folder spec accept a Done folder child (integration request 2)'."
  - id: RS-2
    category: discovered-work
    kind: bug
    summary: "The integration agent definition tells the agent to commit with a message naming the request number but never states the Conventional Commits subject form, while the implementation agent definition does. Integration commits therefore follow the project's commit rule only by chance; this run produced two that do not (RS-1)."
    evidence: ".agents/agents/integration.md:71 (\"Commit in your worktree, one commit per applied request where practical, each message naming the request number.\") vs .agents/agents/implementation.md:81 (\"Commit subjects are Conventional Commits (`feat:`, `fix:`, `test:`, `docs:`, `refactor:`, `chore:`), never a bare task id\"); commits efd0c38 and 131f786."
    blocker_assessment: can-wait
    reason: "The two commits in this change can be reworded by hand (RS-1); the agent doc gap affects only future integration batches and does not change what this feature ships."
