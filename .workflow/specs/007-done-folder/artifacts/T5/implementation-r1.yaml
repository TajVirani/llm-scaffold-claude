considered_not_built:
  - "Requiring the checked-out branch to equal the spec's spec_branch for a single move: the AC asks only for the current branch and never main, and the sweep runs on another spec's branch; refusing main and a detached HEAD covers that."
  - "Rolling back after a failure mid-move (mv done, rewrite or commit failing): every refusal check runs before mv, so only an I/O or git error can stop the script halfway. It then exits 2 and names the failure."
  - "Angle-bracket link targets (](<path with spaces>)) in the moved spec: they are skipped by the ../ adjustment; none appear in the spec templates."
  - "Tying a work-backlog item to the spec by its origin_spec value: items are matched by the <NNN-slug>-disc-*.md file name glob, the reuse pattern sign-off 5.5 uses."
