    location: .agents/skills/feature-workflow/scripts/initiative-transition.sh (git mode 100644)
    claim: "The new single writer is committed without the executable bit, but large-path.md runs it directly as a command."
    consequence: "Every IT call in the large path, entered exactly as large-path.md says, fails with 'Permission denied' (exit 126): conversion, every step marker, every question and slice change, the status flips. install.sh copies the file with the same mode, so target projects get the same failure. The module only says what to do on exit 1 or 2. The suites call it through bash (tests/fixtures/initiative.sh:59), which hides the problem. Related gap: claude-settings.template.json has no Bash(.agents/skills/feature-workflow/scripts/initiative-transition.sh:*) allow entry, though it has one for every sibling script."
    evidence:
      basis: ".workflow/profiles/shell-scripts.md: '.agents/skills/<s>/scripts/: the skill's executable logic.' Every other script in this folder is 100755 (git ls-files -s)."
      diff: "new file mode 100644 initiative-transition.sh; large-path.md:9 'type the full path every time from the project root, because sandboxed projects allow those exact command lines'"
    suggested_fix: "git update-index --chmod=+x on the script; add the allow entry to claude-settings.template.json (and this repo's .claude/settings.json); have one suite run the script directly instead of through bash."
