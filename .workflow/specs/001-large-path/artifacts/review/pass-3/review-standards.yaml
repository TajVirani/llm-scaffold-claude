findings:
  - id: RS-1
    category: profile
    severity: medium
    confidence: 80
    location: ".agents/hooks/session-start-resume.sh:66-200"
    claim: "The resume hook now holds about 100 lines of large-path business rules: which initiatives can be resumed, which ref wins (a local branch beats the working tree unless it is checked out, then origin), and the done-on-main test for emitted specs. None of this goes through a feature-workflow script."
    consequence: "Two places now decide when an initiative can be resumed, and they already disagree. The hook hides a planned initiative whose emitted specs are all done on main. The SKILL.md branch 4 listing, used by Codex or any session without the hook, still shows it because its status is not done. A later change to the large-path rules (the module's main-ref and 6.13 logic) has to be copied into the hook by hand, or the two drift further."
    evidence:
      basis: ".workflow/profiles/shell-scripts.md: \"`.agents/hooks/`: thin host adapters ... Never business logic: call the owning skill's script instead.\" Checklist: \"Hook logic stays thin: real work is in the owning skill's script.\""
      diff: "+initiative_ref() { ... +spec_done_on_main() { ... +    case \"$status\" in done) continue ;; planned) ... for s in $emitted; do spec_done_on_main \"$s\" || { open_spec=$s; break; }; done"
    suggested_fix: "Move the listing (find initiatives, pick the ref, apply the planned/done-on-main filter) into one feature-workflow script, for example an `initiative-transition.sh list` subcommand. Have both the hook and SKILL.md branch 4 call it."
  - id: RS-2
    category: profile
    severity: medium
    confidence: 80
    location: ".agents/skills/feature-workflow/scripts/initiative-transition.sh:50-51"
    claim: "The new script uses exit 1 for usage and environment errors and exit 2 for a refused transition. That is the reverse of the profile's convention for new scripts. The same change adds open-task-pr.sh generic mode, which follows the profile (2 = usage)."
    consequence: "Two interfaces added in one change give exit 2 opposite meanings. A developer or module author who follows the written profile will read a refused slice or question transition as an environment error, or the reverse. The convention also erodes for whatever new script is copied from this one next."
    evidence:
      basis: ".workflow/profiles/shell-scripts.md: \"Exit codes: `0` ok, `1` the check found a problem or refused, `2` usage, environment or preflight error, documented in `# Exit:`. Existing scripts keep their codes\""
      diff: "+# Exit: 0 done; 1 usage or environment error (missing yq, not a git repo, missing folder or file, unknown slice or question\n+#   id, malformed value); 2 illegal transition or a result the template validator rejects, with the reason on stderr."
    suggested_fix: "Swap the codes to the profile's 0/1/2 and update `# Exit:`, the large-path Conventions line and the tests. Or, if matching status-transition.sh is intended, record that as a written exception in the profile."
  - id: RS-3
    category: smell
    severity: medium
    confidence: 80
    location: ".agents/hooks/codex-pre-spawn.sh:100-113; .agents/hooks/session-start-resume.sh:66-73"
    claim: "Possible Duplicated Code: both hooks have their own copy of the 'find initiatives in the main checkout folder plus local and origin initiative/* branches' scan. The for-each-ref and sed normalisation differ only slightly, and the explanatory comment is copied word for word."
    consequence: "What counts as an existing initiative is defined twice in two hooks. The copies already differ (one lists every name using a single-segment `[^/]*` match, the other counts NNN-* by prefix stripping). The Codex spawn check and the resume offer can disagree on whether an initiative exists, and a change to branch naming or remotes has to be made in both."
    evidence:
      basis: "Fowler smell baseline: Duplicated Code"
      diff: "+      { git -C \"$root\" for-each-ref --format='%(refname:lstrip=2)' \"refs/heads/initiative/$1-*\" \"refs/remotes/origin/initiative/$1-*\" 2>/dev/null || true; } \\  /  +    { git -C \"$root\" for-each-ref --format='%(refname:lstrip=2)' refs/heads/initiative refs/remotes/origin/initiative 2>/dev/null || true; } \\"
    suggested_fix: "Put one 'initiative names' function in a sourced hook helper (`.agents/hooks/_initiatives.sh`) or the owning skill's script, and call it from both hooks."
