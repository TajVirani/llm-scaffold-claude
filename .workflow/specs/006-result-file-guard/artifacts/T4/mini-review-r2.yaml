    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh:142"
    blocker_assessment: "blocks-this-task"
    reason: "Acceptance criterion 2 requires every sed w/W form to be denied with the cd hint. These forms reach the same check and pass it, so the fix round did not close the class."
