out_of_scope_noticed:
  - kind: "decision"
    summary: "The sed allowlist also accepts -E and -r, alone or combined with -n (for example -nE), and the header documents them. D31 names only sed -n. The extra flags do not change how an address or script parses, so the read-only result holds; whether the spec wants them is a scope call."
    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh:147, 168 (and header line 25)"
    blocker_assessment: "can-wait"
    reason: "D31 wording names sed -n only; I found no write or exec path through the extra flags, so this is a scope question, not a safety gap."
  - kind: "bug"
    summary: "The header says every sed word is plain or wholly quoted with no backslash. The code allows a backslash inside a single-quoted word, so a file operand such as a single-quoted name with a backslash passes as a read (sed -n '1p' 'a\\b' f exits 0). Address bodies still exclude the backslash, so no script with a backslash passes."
    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh:27-28 (header), 142 (re_word accepts a single-quoted word with any backslash)"
    blocker_assessment: "can-wait"
    reason: "Header overstates the rule for file operands only; a file operand cannot write under sed -n, so no write gets through because of the mismatch."
