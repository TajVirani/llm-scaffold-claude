out_of_scope_noticed:
  - kind: bug
    summary: "group_cmds keeps only hook objects with a command string, so a user hook of another type (for example a prompt-type hook) is not counted as the group's own hook. A group that runs one template command and such a hook is merged under the no-terminal default, although the header says a mixed group is kept. The prompt's hook list also omits it. split_or_keep does count such a hook, so the two paths disagree."
    evidence: "install.sh:276 (group_cmds), install.sh:298 ($own), install.sh:309 (auto choice), install.sh:450 (prompt lists $gc), install.sh:328-330 (only_template_hooks rejects such hooks), install.sh:331 (hook_names shows non-command hooks, so the intent is to list them), header install.sh:58-59"
    blocker_assessment: can-wait
    reason: "A user's own hook has its matcher widened without a warning that names it. This needs a hook object with no command string in a group that also runs a template command under a differing matcher, so it is rare."
