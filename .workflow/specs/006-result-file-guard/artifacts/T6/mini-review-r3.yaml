out_of_scope_noticed:
  - kind: "bug"
    summary: "When a group that runs two template groups' commands is rewritten, the template's hook objects replace the user's, so a user's own per-hook keys (for example a custom timeout) are dropped. The warning names only the matcher change."
    evidence: "install.sh:311-313 (only_template_hooks accepts any hook whose command matches), install.sh:266-267 (merge_groups re-adds template hook objects), install.sh:319 (warning text); .agents/hooks/claude-settings.template.json PreToolUse Write|Edit|NotebookEdit group (timeout 10)"
    blocker_assessment: "can-wait"
    reason: "A user's customised timeout on one of those commands is silently reset to the template's value. The case needs a split group with a per-hook key, so it is rare, but the warning does not say it happened."
