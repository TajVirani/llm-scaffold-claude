findings:
  - id: RE-1
    category: missing
    severity: high
    confidence: 85
    location: ".agents/agents/integration.md:40"
    claim: "The integration agent definition still describes an isolation launch: it never tells the agent to work in the orchestrator-made worktree with a leading `cd <worktree> &&`, and it calls that worktree 'the checkout you were launched in', which is now the main checkout. implementation.md:30 has the same Phase 1 wording ('Phase 1: the checkout you were launched in')."
    consequence: "On Claude, integration and Phase 1 agents now start in the main checkout (no isolation). Read literally, integration.md has the agent run `git rev-parse HEAD`, run-toolchain.sh with `--cwd \"$PWD\"` and commit in the main checkout, and its prescribed result-file command becomes `cd <main checkout> && ...`. The guard denies all of these. A Phase 1 agent that takes its launch cwd as its worktree fails the two-paths self-check and returns blocked 'not launched in the task worktree'. Either way the orchestrator gets repeated denies, which the new Stops row turns into a blocked batch or spec. The capability then rests on the agent recovering from the deny hint, not on the brief. Nothing catches this: worktree-guard.sh fills every '*launched*' placeholder with the agent worktree (tests/hooks/worktree-guard.sh:174), and JRN-010, the real-launch check, has not run."
    evidence:
      basis: "spec.md Assumptions: 'Launching without `isolation` and confining by the brief and the guard, as Phase 3 already does, works for Phase 1 and integration agents too.' CAP-NEW-result-file-write success: 'each brief's prescribed result-file write passes the guard'."
      diff: "integration.md:76-85 was rewritten by this change but keeps 'cd <absolute path of the checkout you were launched in> && mkdir -p \"<main checkout>/...'. Lines 40, 62-67 and 71 are untouched: '`git status` must be clean ... Record the base commit: `git rev-parse HEAD`', '--cwd \"$PWD\" --exclude-unfinished', 'Commit in the checkout you were launched in'. No task's predicted files or criteria cover these lines (tasks/T03 covers only the result-file step)."
    suggested_fix: "Give integration.md a 'Confirm the worktree' step like implementation.md step 1: its worktree is the absolute path the brief names (s<NNN>_integration_<enc>), and every Bash command starts with `cd <worktree path> &&`. Replace 'the checkout you were launched in' with that path in integration.md and in implementation.md:30 for Phase 1."
  - id: RE-2
    category: wrong
    severity: low
    confidence: 85
    location: ".agents/skills/feature-workflow/modules/implementation-orchestrator.md:120"
    claim: "The 3.2 routing text still says 'No stop audit fires for integration', but on Claude the change now runs the stop audit for integration agents."
    consequence: "The orchestrator reading 3.2 does not expect an integration stop to be blocked on toolchain failure, and it ignores the audit's warning and gave-up records under artifacts/integration-<work_type>/audit.json, such as 'no worktree at ...; the toolchain was not run'. That is the warning the end state asks the audit to raise when the worktree is missing."
    evidence:
      basis: "verification-plan.md End state: 'the stop audit, for a Claude Phase 1 or integration launch, runs in its agent worktree (integration with the full toolchain ...), and warns and allows when the worktree is missing'."
      diff: "post-implementation-audit.sh: '+case \"$agent_type\" in implementation|integration) ;; *) exit 0 ;; esac'. implementation-orchestrator.md:120, unchanged inside the edited 3.2 section: '- **Toolchain.** No stop audit fires for integration; the agent runs `run-toolchain.sh` itself'."
    suggested_fix: "Say the Claude stop audit runs the full toolchain in the integration worktree (Codex: none), and tell the orchestrator to read audit.json there as at 3.5-3.6."
