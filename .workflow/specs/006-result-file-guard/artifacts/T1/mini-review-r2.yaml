out_of_scope_noticed:
  - kind: "decision"
    summary: "Checklist item 3 says nothing is silently swallowed, but the integration stop with no transcript exits silently by the ruling in the design log. Item 3 passes here on that ruling, so the checklist wording and the ruling disagree."
    evidence: ".agents/hooks/post-implementation-audit.sh:122-123; .workflow/specs/006-result-file-guard/design-log.md:306-310"
    blocker_assessment: "can-wait"
    reason: "The ruling settles this task's behaviour, so the review does not fail on it; the wording gap would make a later reviewer fail the same line again."
  - kind: "decision"
    summary: "wf_agent_worktree_name needs three or more digits in the spec folder number, as wf_norm_folder does, while resolve-launch and the pre-change guard accepted any digit count. A Phase 3 task in a folder such as 12-foo was confined before and now names no worktree in either hook."
    evidence: ".agents/lib/workflow-paths.sh:135; git show 4b66751:.agents/hooks/worktree-write-guard.sh:87-88 (pre-change ^[0-9]+$ test)"
    blocker_assessment: "can-wait"
    reason: "The repo numbers specs with three digits, so this changes only non-standard folders; the spec should say which digit rule wins before a spec uses one."
