summary: "Fix round after mini-review r2. In worktree-write-guard.sh, a launch header that parses but that wf_agent_worktree_name rejects (e.g. spec_dir .workflow/specs/12-foo) now denies the Write, Edit, NotebookEdit or Bash call, fail closed, quoting the lib's reason. Before, the guard dropped the reason and allowed the call. The header's Behaviour lines describe the deny, and its Sources line names lib/workflow-paths.sh. Isolation launches get the same deny and do not fall through to the linked-worktree cwd rule: a header the orchestrator wrote but the name rule rejects is a malformed launch, and confining the agent to its cwd would hide it. The cwd rule still covers launches whose transcript or header cannot be found."
