findings:
  - id: RS-1
    category: standard
    severity: medium
    confidence: 100
    location: "tests/hooks/worktree-guard.sh:92"
    claim: "A new body comment in the worktree guard suite names a journey id (JRN-001)."
    consequence: "Journey ids are numbered per spec, so JRN-001 already means something different in spec 006 and spec 00010. A maintainer reading the suite later cannot tell which journey is meant, and the reference goes stale when the spec is closed. Allowing it also weakens a rule that 3.7 enforces as a hard fail."
    evidence:
      basis: ".workflow/rules.md Cross-cutting policy: \"Body comments follow .agents/skills/feature-workflow/references/readable-code.md (a comment gives the reason in plain words; no decision IDs, doc or workflow paths, and no journey (`JRN-###`), finding or task id).\" readable-code.md R4: \"A comment never points at a decision record or a document.\" The Checking table grades an R4 breach at 4.1 as standard, medium, confidence 100."
      diff: "+# The cause each JRN-001 deny reason must name."
    suggested_fix: "Say the reason in plain words without the id, e.g. \"# The cause each deny reason must name when an agent's worktree cannot be established.\""
  - id: RS-2
    category: naming
    severity: low
    confidence: 80
    location: ".agents/hooks/worktree-write-guard.sh:29"
    claim: "The rewritten Behaviour header uses \"named worktree\", which the glossary lists as an alias to avoid for Agent worktree. The new suite header and labels in tests/hooks/worktree-guard.sh (lines 14, 17, 117-118, 335-346, 372) use it too."
    consequence: "The point of this change (JRN-005) is to make the guard's wording match the glossary's Agent worktree. Leaving an avoided alias in the hook's interface doc puts the drift back, and the next person who edits the hook may copy it."
    evidence:
      basis: ".workflow/GLOSSARY.md, Agent worktree: \"_Avoid_: Task worktree (Phase 1 and integration are not tasks), named worktree, isolation worktree\""
      diff: "+#       that worktree. Otherwise (named worktree missing, transcript not found, launch header missing or not parsed, cwd outside any git"
    suggested_fix: "Write \"the named agent worktree is missing\" (as the line above does), and in the test labels and suite header say \"agent worktree missing\"."
