out_of_scope_noticed:
  - kind: "bug"
    summary: "Failures before CONFINED is set to 1 are not denied. The EXIT trap denies only once CONFINED is 1, so a non-zero exit at the workflow-paths.sh source or the stdin read lets the call through as a non-blocking error, which the sibling _guard-common.sh convention rules out."
    evidence: ".agents/hooks/worktree-write-guard.sh:56, :73, :75, :82"
    blocker_assessment: "can-wait"
    reason: "Pre-existing and untouched by this diff; reachable only with a partial install, where lib/ is missing while check-worktree-scope.sh exists."
  - kind: "bug"
    summary: "When the transcript is not valid JSON, jq stderr is discarded at line 109 and the deny reason then says the transcript has no first user message, which sends the orchestrator to the wrong cause. The deny still happens, so item 3 passes."
    evidence: ".agents/hooks/worktree-write-guard.sh:109, :111"
    blocker_assessment: "can-wait"
    reason: "Only the cause text is wrong, and only for a malformed transcript."
  - kind: "decision"
    summary: "With jq missing in an installed workflow, the hook now denies every Bash, Write, Edit and NotebookEdit call, the main session included. The base allowed them (base line 60). The header documents it, but the reach is wider than the sub-agent case the commit title names."
    evidence: ".agents/hooks/worktree-write-guard.sh:22-23, :66-71"
    blocker_assessment: "can-wait"
    reason: "Intended by this diff's header; the spec owner should confirm that blocking the main session when jq is missing is wanted."
