findings:
  - id: RS-1
    category: profile
    severity: medium
    confidence: 88
    location: ".agents/skills/feature-workflow/modules/sign-off.md:103-112"
    claim: "Sign-off 5.4 still says a host template has only `##` headings to fill, and that exit 2 means it 'has no `##` headings'. Since T5 (D19), check-pr-body.sh project mode reads every heading level `#` to `######` and exits 2 only for a template with no headings at all."
    consequence: "At 5.4 the agent fills only the `##` sections of a host template that also uses `#` or `###` headings. The check then exits 1 on each heading it skipped, which costs extra fill rounds. On an exit 2 the agent tells the stakeholder the template 'has no ## headings', which is wrong: a template with only `###` headings passes. The prose and the script now disagree, and the next edit to either one will widen the gap."
    evidence:
      basis: ".workflow/profiles/agent-docs.md: 'follow the `writing-for-agents` skill'; .agents/skills/writing-for-agents/SKILL.md:78: 'The environment is a source of truth: scripts, config ... A document that restates it is a cache that goes stale.' Spec D19 / spec.md:50: 'each of that template's headings, at any level `#` to `######`, appears in the body'."
      diff: "+   - A path: fill that host template's own `##` headings from the same evidence, in its order; the ten workflow sections are not added.\n+   Exit 2 whose message names the host template from `pr_template` means that template is unusable: unreadable, or it has no `##` headings."
    suggested_fix: "Say 'fill each of that host template's headings at its own level' and 'unreadable, or it has no headings'. Better still, defer to check-pr-body.sh's fault lines and exit message instead of restating its heading rule."
  - id: RS-2
    category: profile
    severity: low
    confidence: 80
    location: ".agents/skills/feature-workflow/modules/sign-off.md:102; .agents/skills/feature-workflow/assets/pr-template.md:34-35"
    claim: "Two files give different instructions for the Special things to note section. Sign-off 5.4 always puts report.md and the task PRs/MRs there. The template's guidance draws the section only from report.md Known gaps and Deferred and says to write 'None.' when both are empty."
    consequence: "An agent or maintainer who follows the template alone writes 'None.' and leaves out the report.md and task PR links that 5.8 used to put in the PR. Editing one file does not update the other, so Sign-off PR descriptions can drift apart."
    evidence:
      basis: ".agents/skills/writing-for-agents/SKILL.md:77: 'Single source of truth: each meaning lives in one place.' (required for agent-docs by .workflow/profiles/agent-docs.md)"
      diff: "+Name `report.md` and the task PRs/MRs (`pr` on the records) under Special things to note.\n+<!-- From report.md Known gaps and Deferred: skipped gates, known limits, follow-up items with their\n+.workflow/deferred/ links. \"None.\" when both are empty. -->"
    suggested_fix: "Put the report.md and task PR/MR links in the template's Special things to note guidance, so 'None.' covers only the gaps and deferred items, and drop the separate sentence from sign-off 5.4."
