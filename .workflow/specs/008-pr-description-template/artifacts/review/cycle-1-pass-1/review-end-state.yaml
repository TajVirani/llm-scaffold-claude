findings:
  - id: RE-1
    category: wrong
    severity: medium
    confidence: 80
    location: ".agents/skills/feature-workflow/scripts/check-pr-body.sh:403"
    claim: "Project mode only recognises level-2 (`##`) headings in the host template, so a host PR/MR template that uses `#` or `###` headings is refused outright (exit 2), and in a template that mixes levels, only the `##` headings are checked. Neither the 5.2 row nor project-setup nor rules-setting.sh checks this before offering or accepting the path."
    consequence: "A project whose `.github/pull_request_template.md` uses `###` headings (a common shape) can pick it at project-setup or 5.3, and rules-setting.sh accepts it. Every later sign-off then hits exit 2 at 5.4, which sign-off.md treats as 'a usage error or a broken install: stop and report it'. No route back to a 5.2 proposal is described for that case, so the stakeholder's chosen setting blocks every Sign-off PR. In a template that mixes levels, `###` sections can be left empty and still pass."
    evidence:
      basis: "spec.md Assumptions: 'With a path, the check script only requires that each of that template's headings is present and non-empty'; data-model.md: 'the headings of the template file `pr_template` names, each non-empty'. Neither limits this to `##` headings, and the 5.2 row and project-setup offer every host template found at the D15 paths."
      diff: "+expected=$(headings_of \"$(outline \"$template\")\") / +[[ -n $expected ]] || die \"no ## headings in template: $template\" ; outline() keeps only lines matching /^## /. The test 'JRN-003 a project template with no ## headings exits 2' (tests/scripts/check-pr-body.sh) pins this behaviour, and sign-off.md 5.4 says 'Exit 2 is a usage error or a broken install: stop and report it.'"
    suggested_fix: "Either read every ATX heading level of the host template in project mode, or reject a template with no `##` headings when it is offered or read (5.2 row, project-setup, rules-setting.sh pr_template). Also give 5.4 a route to a `pr_template` proposal when this happens."
