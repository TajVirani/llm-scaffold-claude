  - "Suspicion (below 80, likely medium): with set -m active at the launch, bash no longer redirects the background suite's stdin from /dev/null, so suites now inherit the runner's stdin and are in a background process group. A suite command that reads stdin without a redirect would, from an interactive terminal, be stopped by SIGTTIN and hang the run, or would consume a piped stdin, where before it read EOF. Searched the stdin-reading hooks and scripts (payload=$(cat) / input=$(cat) in .agents/hooks/*, check-staged-cache.sh, resolve-launch.sh) and their test call sites in tests/hooks and tests/scripts: all found are piped, so no current hang was shown. Settle by running tests/run-all.sh from an interactive terminal (stdin a tty) and with stdin an open pipe, comparing to the baseline, or by adding </dev/null to the suite launch."
