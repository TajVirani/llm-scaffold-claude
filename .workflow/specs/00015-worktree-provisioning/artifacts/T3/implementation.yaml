summary: "worktree-setup.sh now implements agent, scratch, setup, check, env and remove: it gives each spec worktree a slot, copies the ignored copy-list files from the main checkout as regular files, runs worktree_setup with the five isolation values, and refuses symlinks into another checkout. spec-worktree.sh create runs setup on the first run and on a re-run. It prints its two stdout lines first, then exits with setup's code if setup fails. remove checks the worktree is clean, then runs services_down with the isolation values and carries on when that command fails."
