out_of_scope_noticed:
  - kind: "decision"
    summary: "At the matcher prompt, end of input (Ctrl-D) counts as Enter. A mergeable group is then merged, and in ask mode a merge prints no Warnings line, so the change shows only in the settings file."
    evidence: "install.sh:440"
    blocker_assessment: "can-wait"
    reason: "The header at install.sh:434 records the choice, so this is a design question about whether end of input should cancel instead of merge. It is not a swallowed error, and no checklist item covers it."
