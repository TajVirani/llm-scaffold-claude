summary: "Fix round 1. A hook group running commands of two or more template groups of one event is no longer asked about, in any mode. If all its hooks are template commands, it is removed and the append puts each command back under its own template group, with a Warnings line naming the event and the commands. If it also runs a user hook, it is kept unchanged, with a Warnings line naming its hooks. Groups left for resolve_group now touch exactly one template group, so each gets at most one question. An ask-mode group without an answer counts as kept, with a warning; the warnings of the plan built before the answers are not printed. A matcher that is not a plain | list is now kept, with a warning, under merge and without a terminal, also when the template matcher matches everything; replace still drops it in that case. The header now says the same, and the non-plain --matchers=merge test asserts only the kept value."
