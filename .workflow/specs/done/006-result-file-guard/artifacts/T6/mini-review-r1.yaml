out_of_scope_noticed:
  - kind: bug
    summary: "A non-plain group matcher is dropped, not kept, when the template group's matcher is match-all. $mergeable is true whenever the template matcher is match-all, so merge sets the matcher to null and deletes it. The header says only plain lists are merged and a non-plain matcher is kept with a warning. The template's SessionStart group has no matcher, so a user's narrowed SessionStart group such as ^(startup|resume)$ becomes match-all under the no-terminal default, with a warning."
    evidence: "install.sh:273, install.sh:274, install.sh:288 against install.sh:40-42 and install.sh:46-48"
    blocker_assessment: blocks-this-task
    reason: "The header and the code disagree on what happens to a user's own matcher, and the change widens that user's hook to every event."
  - kind: bug
    summary: "The matcher test for a non-plain matcher under --matchers=merge accepts implementation|integration as well as the kept value. That is what a replace would produce, so a regression that replaces the matcher still passes."
    evidence: "tests/scripts/install-upgrade.sh:330-331"
    blocker_assessment: can-wait
    reason: "The assertion is too loose; the behaviour itself is right today."
