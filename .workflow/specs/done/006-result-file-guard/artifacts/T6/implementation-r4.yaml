summary: "Fix round 4. A group whose matcher is not a string is now kept in every mode, --matchers=replace included, with one Warnings line naming the event, its hooks and why. The rewritten-groups removal has a jq comment saying why it waits until the loop ends. The D32 rewrite warning now says the template hook settings replace the user's. Audit of every outcome in resolve_matchers, split_or_keep, resolve_group and the prompt closed three more gaps. --matchers=merge|replace changed matchers without a line; each now prints one line naming the mode. The merge refusal blamed the group's matcher even when the template's was the one that is not a plain | list; the warning and the prompt now name the right one. The header did not say that the prompt for an unmergeable group offers only replace and keep (Enter keeps), or that the two-template-group rewrite applies only when the matcher does not cover them all. Audit checked: resolve_matchers (no template command: untouched; malformed matcher: kept with one line; two or more template groups with an unsettled one: split_or_keep; otherwise per template group). split_or_keep (all template hooks: rewritten with one line naming the template hook settings; own hooks: kept with one line). resolve_group (non-object, match-all, no template command, covering: untouched and silent; merge: auto, merge and ask; replace: replace and ask; unmergeable: merge and auto; keep: auto-mixed, keep and ask-keep). The ask flow (first plan suppresses matcher lines while questions are pending, ask_matchers prints the answered plan's lines). ask_choice (Enter is merge or keep by mergeability, EOF counts as Enter). Each outcome is now silent only for no change or an answered prompt change, and otherwise prints exactly one line; the header and the JQ_MERGE comment describe each one."
