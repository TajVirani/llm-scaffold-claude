considered_not_built:
  - "A rewritten group whose command another existing group already runs: merge_groups does not re-add that command, so it stays in the other group with that group's settings. The other group is then resolved on its own and gets its own line, so the user still sees one line per group. The warning text does not name this edge, and adding it would lengthen every rewrite line for a rare case."
  - "A group whose hooks field is an object instead of an array: group_cmds can still find a command in it, so it is resolved like any group. It is malformed for Claude Code too, and no rule covers it."
