discovered_work:
  - kind: "decision"
    summary: "The fix brief asked for an allow case `sed -n -e '1p' -e '$p' f`, but the task's acceptance criteria deny any command containing `$` and read_only_chain still does. The sed allowlist accepts a `$` address, yet no command using it can pass. Allowing it would need a quote-aware `$` check (a `$` only inside single quotes, with backslashes outside single quotes denied so quotes cannot be faked), which changes the whole-command denylist. I left that out and tested `-e '1p' -e '5p'` instead."
    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh read_only_chain (`case \"$chain\" in *'$'*...`); probe: check-worktree-scope.sh --command \"sed -n -e '1p' -e '\\$p' f\" from the main checkout exits 2"
    blocker_assessment: "can-wait"
    reason: "A sed call with a `$` address still works with the leading cd, and the acceptance criterion as written is met. Relaxing the `$` rule is a guard-policy decision for the stakeholder."
