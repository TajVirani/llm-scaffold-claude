findings:
  - id: RS-1
    category: discovered-work
    kind: refactor
    summary: "check-worktree-scope.sh deny and allow messages, and the File lines of check-worktree-scope.sh and worktree-write-guard.sh, still say 'task worktree'. This change sends Phase 1 and integration agents through those same paths. The glossary lists 'Task worktree' as an _Avoid_ alias for Agent worktree because 'Phase 1 and integration are not tasks', so a Phase 1 or integration agent that gets denied is told it works in a 'task worktree'."
    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh:2, :114, :125, :234 ('this agent works only in its task worktree $root'); .agents/hooks/worktree-write-guard.sh:2 ('inside its task worktree'); .workflow/GLOSSARY.md Agent worktree _Avoid_: 'Task worktree (Phase 1 and integration are not tasks)'. This change did not add or modify these lines."
    blocker_assessment: can-wait
    reason: "Wording only. The deny still names the right absolute path and the right 'cd <root> &&' fix, so the agent can recover. No behaviour depends on it."
  - id: RS-2
    category: discovered-work
    kind: refactor
    summary: "assetlist.md still describes the behaviour this change removed. The post-implementation-audit row gives the SubagentStop matcher as 'implementation'. D85 item 6 says Phase 1 builds and integration batches 'keep their existing worktree handling' and keeps the isolation-relaunch fallback. This spec makes the matcher 'implementation|integration', creates orchestrator-made worktrees for Phase 1 and integration, and removes the fallback (D5). No amendment note was added, unlike the existing 'Amended by' convention there."
    evidence: "assetlist.md:40 ('`SubagentStop`, matcher `implementation` (script also filters)'); assetlist.md:234 ('Phase 1 builds and integration batches keep their existing worktree handling ... Fallback when an agent cannot work that way: ... relaunch with `isolation: \"worktree\"`'); .agents/hooks/claude-settings.template.json SubagentStop matcher now 'implementation|integration'; .workflow/specs/done/006-result-file-guard/design-log.md D5 'Remove the fallback'."
    blocker_assessment: can-wait
    reason: "assetlist.md is scaffold-only and is never installed, so target projects are not affected. It misleads only a maintainer who reads the decision record, and an amendment note can be added at sign-off or later."
