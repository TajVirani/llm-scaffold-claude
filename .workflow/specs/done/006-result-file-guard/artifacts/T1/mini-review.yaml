out_of_scope_noticed:
  - kind: "decision"
    summary: "The guard's header-parse fallback allows silently. When resolve-launch cannot parse the header, the parse error goes to /dev/null, the name stays empty, and the scope check runs with no worktree, so a non-isolated implementation or integration agent can write into the main checkout with no deny. This is the same fail-open the previous round failed, on a path this diff does not change. The guard's Behaviour says no header means allow, while the profile says guard hooks fail closed on a helper error."
    evidence: ".agents/hooks/worktree-write-guard.sh:92-93 (parse with 2>/dev/null and the if fallback), :23-24 (Behaviour: no header, allow); .workflow/profiles/shell-scripts.md:25 (guard hooks fail closed on a helper error)"
    blocker_assessment: "can-wait"
    reason: "Not introduced by this diff, and the Behaviour text documents allow for no header, so the stakeholder should say which rule wins: the profile fail-closed rule (deny) or the Behaviour text (allow). Not counted against item 3 here."
  - kind: "decision"
    summary: "When the named orchestrator worktree does not exist and the agent's cwd is the main checkout, check-worktree-scope rule 3 allows every write, so a task whose worktree was never created can write into the main checkout with no deny. The audit warns after the stop. The diff applies the same rule to Phase 1 and integration launches; the outcome for them is unchanged from before."
    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh:101-104 (rule 3 allow); .agents/hooks/worktree-write-guard.sh:23-24 (Behaviour: no worktree, allow)"
    blocker_assessment: "can-wait"
    reason: "Pre-existing for Phase 3 and documented in the Behaviour text; a stakeholder should decide whether a named but missing worktree should deny instead of allow."
