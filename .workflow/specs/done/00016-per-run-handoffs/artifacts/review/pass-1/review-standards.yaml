    location: ".agents/skills/handoff/SKILL.md:21"
    claim: "The new Locate step names the checkout kind 'a task worktree', an _Avoid_ alias for the glossary term Agent worktree."
    consequence: "An agent reading the skill meets a non-canonical term for the worktree it runs in (Phase 1 and integration worktrees are not tasks), so the skill's wording drifts from the glossary the other skills and hooks use."
    evidence:
      basis: ".workflow/GLOSSARY.md, Agent worktree: \"_Avoid_: Task worktree (Phase 1 and integration are not tasks), named worktree, isolation worktree\""
      diff: "+2. **Root, folder and file name.** The handoff goes in `.workflow/.handoff/` of the checkout the session works in (a spec worktree, a task worktree or the main checkout), never in another checkout."
    suggested_fix: "Replace 'a task worktree' with 'an agent worktree' in .agents/skills/handoff/SKILL.md line 21."
  - id: RS-2
    category: rule
    severity: low
    confidence: 80
    location: "upstream-lineage.json:2372"
    claim: "The lineage entry for .agents/skills/handoff/SKILL.md still records the handoff location as the main checkout, protected by install.sh's .gitignore block; this change moved it to the session's own checkout with a folder-own .gitignore and did not update the entry."
    consequence: "Whoever next reviews a vendor update of the handoff skill (the rules.md lineage process) reads a wrong description of our local changes and may judge an upstream change against a location the skill no longer uses."
    evidence:
      basis: ".workflow/rules.md Cross-cutting policy: \"Every first-party asset derived from upstream ... gets an upstream-lineage.json entry: kind ..., upstream repo, path and commit, `changes`, `why`, `reviewed_at`.\" The entry's changes line reads: \"location moved from $TMPDIR to a gitignored .workflow/.handoff/ in the main checkout (install.sh's .gitignore block), listed by session-start-resume.sh\""
      diff: "-1. **Root and folder.** Handoffs live in `.workflow/.handoff/` at the main checkout, where the session-start hook looks, even when you work in a worktree.\n+   The folder's own `.gitignore` keeps every handoff out of git, even where the project's `.gitignore` has no entry for it."
    suggested_fix: "Update that changes line to say the handoff is written per run in .workflow/.handoff/ of the session's own checkout, kept out of git by the folder's own .gitignore, and listed per checkout by session-start-resume.sh; bump reviewed_at."
