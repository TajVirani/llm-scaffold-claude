findings:
  - id: RE-1
    category: wrong
    severity: medium
    confidence: 80
    location: ".agents/skills/feature-workflow/modules/large-path.md (6.13, the `planned` / None listed branch)"
    claim: "The new 6.13 gate checks only the initiative's status on the main ref. It never checks whether `initiative/NNN-slug` already exists. If an initiative was reopened at 6.12, main still says `planned` while the branch says `exploring`. When an emitted spec from the original set signs off in that state, 6.13 goes down the `planned` path. If every listed spec is done, it tries to re-create the branch and flip the initiative to `done`."
    consequence: "Who hits this: a stakeholder who reopened a planned initiative and then signs off its last original emitted spec. If the local branch exists, `git switch --no-track -c initiative/NNN-slug` fails with 'already exists', so sign-off ends in a git error instead of reporting 'still exploring'. If the reopened work exists only on `origin/initiative/NNN-slug` (another clone, `pr` mode), the switch succeeds from main. The initiative is then flipped `planned -> done` from the stale main copy and the reopened exploration is left behind. The session-start resume path is not affected, because the hook reads the local branch first."
    evidence:
      basis: "CAP-NEW-initiative-close intent: 'moves a planned initiative to `done` once every emitted spec is done'. large-path.md 6.12: re-creates `initiative/NNN-slug` from main and sets `exploring`, and main keeps `planned` until the next 6.11 merge."
      diff: "large-path.md 6.13 (changed since pass 1): '- **`planned`.** List the emitted specs not yet `done` on main ... - **None listed.** Re-create the branch from the main ref ... `git switch --no-track -c initiative/NNN-slug \"$main_ref\"`'. The status is read only from `git show \"$main_ref:...initiative.md\"`. No step checks `git rev-parse --verify initiative/NNN-slug` or `origin/initiative/NNN-slug`. The 'Empty or exploring' bullet itself notes 'the branch it would re-create still exists'. The JRN-005 hand-off check in tests/scripts/initiative-merge.sh (close_check) covers only the absent-from-main case."
    suggested_fix: "In 6.13, before the `planned` branch, treat an existing `initiative/NNN-slug` (local or on origin) as 'reopened, still exploring': report it and write nothing. Add a JRN-005 assertion for a reopened initiative."
