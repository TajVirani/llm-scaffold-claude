    location: ".agents/skills/feature-workflow/modules/large-path.md:259 (6.13, '`planned`, branch present')"
    claim: "Rework 2 treats `refs/remotes/origin/initiative/NNN-slug` as proof that the initiative was reopened. Under `task_review: pr` or `pr-blocking` that remote branch is always there after the `planned` merge, so a planned initiative never closes."
    consequence: "Under `pr`, which is the default `task_review` and the value in this repo's rules.md, 6.10's commit point runs `git push -u origin initiative/NNN-slug` and 6.11's `open-task-pr.sh` pushes the head branch. 6.11 then deletes only the local branch (`git branch -d`). Nothing deletes the branch on origin, and the Conventions fetch (`git fetch -q origin`) does not prune. When the last emitted spec signs off, or the initiative is resumed, 6.13 finds the remote-tracking ref and reports 'reopened, still exploring'. The initiative stays `planned` on main for good. Anyone who uses the large path with a PR-based review mode meets this, and it undoes the CAP-NEW-initiative-close outcome. Pass 2's F14 only happened after a 6.12 reopen; this happens on every pr-mode initiative."
    evidence:
      basis: "CAP-NEW-initiative-close success: 'resuming a `planned` initiative whose emitted specs are all `done` moves it to `done` through the initiative status script and merges that change into main the same way `planned` was merged'. Constraint: '`pr` and `pr-blocking` push at every commit point and open the PR/MR at `planned` and `done`'."
      diff: "large-path.md 6.13 (98dce0c): '- **`planned`, branch present.** ... `git rev-parse -q --verify refs/heads/initiative/NNN-slug` or `git rev-parse -q --verify refs/remotes/origin/initiative/NNN-slug` succeeds. The initiative was reopened at 6.12 ... write nothing.' 6.11 ends with only 'git branch -d initiative/NNN-slug'. Commit point: 'git push -u origin initiative/NNN-slug   # task_review pr or pr-blocking'. Conventions: 'git fetch -q origin' (no --prune). I grepped large-path.md, open-task-pr.sh and session-start-resume.sh for prune / push --delete / :refs and found nothing. In tests/scripts/initiative-merge.sh the done flip runs only in the `local` fixture (P). The pr fixture (Q) pushes the branch ('JRN-005 pr: the initiative branch is pushed') but never runs close_check. close_check's new 'refs/remotes/origin/$BR && return 0' line would return early in that state."
    suggested_fix: "Tell a reopened initiative apart by what the branch holds, not by whether it exists. For example, reopen only if the branch tip's initiative.md reads `exploring`, or if the branch has commits that are not on the main ref (`git merge-base --is-ancestor`). Or have 6.11 delete the remote branch after the merge, or prune on fetch. Add a JRN-005 assertion: a pr-mode planned merge followed by all specs done leads to the done flip."
