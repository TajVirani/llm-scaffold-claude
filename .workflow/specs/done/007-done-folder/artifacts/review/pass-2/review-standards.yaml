findings:
  - id: RS-1
    category: smell
    severity: medium
    confidence: 82
    location: ".agents/skills/feature-workflow/modules/large-path.md:290-295 (6.13 rewrite loop); .agents/skills/feature-workflow/scripts/move-to-done.sh:265-287 (point_at_done_folder)"
    claim: "Possible Duplicated Code: the change adds the same spec-path rewrite twice, and the two copies already behave differently. The 6.13 sed treats a path that ends a sentence as a different name, so it leaves it unrewritten. move-to-done.sh rewrites it."
    consequence: "When 6.13 closes an initiative, a line in the initiative's files that ends with the spec path and a full stop (for example 'Emitted as .workflow/specs/012-alpha.') keeps the old top-level path, which no longer exists. move-to-done.sh rewrites the same line in every other .workflow/ file. Checked on stdin: the 6.13 expression leaves 'Emitted as .workflow/specs/012-alpha.' unchanged, and the move-to-done.sh expression turns it into '.workflow/specs/done/012-alpha.'. Any later fix to one copy will not reach the other. Work-backlog item 007-done-folder-disc-001 records the duplication only as a risk of drift; this is the drift, already present."
    evidence:
      basis: "Smell baseline: Duplicated Code (the same logic shape appears in more than one hunk or file in the change)."
      diff: "+        sed -E -e ':again' -e \"s#(^|[^A-Za-z0-9._-])specs/$spec([^A-Za-z0-9._-]|\\$)#\\1specs/done/$spec\\2#g\" -e 't again' \"$f\" >\"$f.tmp\" && mv \"$f.tmp\" \"$f\" | +  end=\"(\\\\.?[^$SLUG_CHARS]|\\\\.?\\$)\" | +  exprs=(-e ':again' -e \"s#(^|[^$SLUG_CHARS])$SPECS_LEAF/$name_re$end#\\\\1$SPECS_LEAF/$DONE_LEAF/$name\\\\2#g\")"
    suggested_fix: "Give move-to-done.sh a mode that rewrites one moved spec's path inside a given folder, and have 6.13 call it instead of its own sed (the scope of 007-done-folder-disc-001). At the least, copy move-to-done.sh's end pattern, which keeps a trailing full stop, and its escaped name into the 6.13 loop."
