findings:
  - id: RE-1
    category: wrong
    severity: high
    confidence: 90
    location: ".agents/skills/feature-workflow/modules/sign-off.md:192"
    claim: "The 5.8 one-time sweep runs after 5.7 has set the signing-off spec to done, and move-to-done.sh --sweep moves every top-level done spec with no exception for the current one. So the sweep also moves the spec being signed off, inside the sweep commit. The 5.8 move step after it then exits 2 (spec.md not found at the old path), and the doc tells the orchestrator to stop."
    consequence: "At this spec's own sign-off, where D16 requires the sweep, following sign-off.md as written puts 007 into done/ inside the sweep commit instead of in a commit of its own, skips the D14 move-then-check-moved-body-then-path-diff order, and halts sign-off at the move step with an exit 2 the doc treats as a stop. The same happens in any target project whose first sign-off runs the catch-up sweep. The stakeholder is left with an unpublished, half-ordered sign-off to sort out by hand."
    evidence:
      basis: "design-log.md D16: \"the one-time sweep of 001-006 and 008 runs at 5.8 for this spec only, before the move of 007 itself, committed alone\"; spec.md Constraints (D14): \"5.8 order: commit what is left, check pr-body.md, move and rewrite ..., commit, run check-pr-body.sh on the moved body, show the stakeholder the path-only diff\". sign-off.md 5.7 sets `status ... done --step 5.7` before 5.8."
      diff: "move-to-done.sh:375-380 `for spec_md in \"$(wf_path \"$ROOT\" \"$WF_SPECS\")\"/*/spec.md; do` ... `[[ \"$status\" == \"done\" ]] || continue` (no skip for the spec on the checked-out spec branch). sign-off.md:192 `run .agents/skills/feature-workflow/scripts/move-to-done.sh --sweep, keep its moves in one commit of their own before this spec's move`. tests/scripts/move-to-done.sh JRN-003 sweeps on spec/013-beta, a spec that is not done, so the 5.8 case (the current spec already done) is never exercised; tests/lint/done-folder-docs.sh has no sweep check."
    suggested_fix: "Have --sweep leave out the spec named by the checked-out spec branch, or take the current spec as an exclusion argument, and have 5.8 pass it. Or run the sweep before 5.7 sets done. Add a suite case that sweeps on the branch of a done spec."
