    location: ".agents/skills/feature-workflow/scripts/worktree-setup.sh:117-120,159"
    claim: "Possible Duplicated Code: run_worktree_setup builds the five isolation values itself (WF_PORT_OFFSET=$((SLOT * 100)) and the rest) instead of reusing print_isolation_values, which env, run-toolchain.sh and spec-worktree.sh stop_services all go through."
    consequence: "A later change to the values (a new value, a different offset formula) made in print_isolation_values would reach the toolchain commands and services_down but not worktree_setup, so a worktree's dependency install could compute different ports or names than its tests and services."
    evidence:
      basis: "Smell baseline: Duplicated Code (the same logic shape in more than one hunk). Two of three consumers in the change eval the env output; this one re-derives it."
      diff: "printf 'export WF_SLOT=%q\\nexport WF_INSTANCE=%q\\nexport WF_PORT_OFFSET=%q\\n...' \"$SLOT\" \"$INSTANCE\" \"$((SLOT * 100))\" ... | export WF_SLOT=$SLOT WF_INSTANCE=$INSTANCE WF_PORT_OFFSET=$((SLOT * 100)) WF_MAIN_ROOT=$MAIN_ROOT WF_SPEC_ROOT=$SPEC_ROOT"
    suggested_fix: "In run_worktree_setup's subshell, replace the export line with eval \"$(print_isolation_values)\" so every consumer takes the values from one function."
