    location: ".agents/skills/regenerate-caches/scripts/extractors/bash.sh:222-223"
    claim: "The new quote walk hides every character of a double-quoted string that spans lines, except a $(...) inside it, so a backtick command substitution inside such a string is no longer read. The base revision reported it: split_commands splits on backtick (bash.sh base line 395) and report_cwd_relative_calls ran on the same line (base line 161), so a ./x.sh in backticks on a continuation line was an unresolved edge. The change repeats the pitfall that the extractor drops a call it had already detected."
    consequence: "A script the shell runs from a multi-line double-quoted string, such as a usage text or a message built across lines, drops out of the Unresolved edges of the architecture cache, so readers who rely on that list see fewer unresolved calls than the code makes."
    evidence:
      basis: "pitfalls.md: 'Report a detected call as unresolved; never filter it out' (What happened: the bash graph extractor dropped script calls it had already detected through filters and option scans). The new bash.sh header names only a $(...) inside a double-quoted string as a run-by-the-shell exception; backticks are not named."
      diff: "} else { | keep_or_hide(ch, spans[depth])"
    suggested_fix: "Keep the text of a backtick span inside a double-quoted string the way the $(...) context keeps its text, name backticks in the header's exception, and add a fixture case to tests/scripts/extractor-bash.sh: a multi-line double-quoted usage text holding a backtick ./x.sh line, expecting that call. Medium: also propose recording it as a review lesson at the next 5.7, symptom: the extractor hides a call the shell runs inside a multi-line double-quoted string."
