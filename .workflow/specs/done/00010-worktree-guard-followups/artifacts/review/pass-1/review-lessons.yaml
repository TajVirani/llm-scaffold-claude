  - id: RL-1
    category: lesson
    severity: high
    lesson: "RL-005"
    confidence: 85
    location: ".agents/hooks/claude-settings.template.json:147-150"
    claim: "The settings template repeats RL-005: it allowlists yq --front-matter=extract by prefix (line 130) and then denies that tool's write forms with text patterns (lines 147-150), so a spelling the patterns miss still passes as a read. The same four rules sit in .claude/settings.json:157-160."
    consequence: "Whoever runs a yq --front-matter=extract call with an in-place spelling the patterns miss, such as -Pi on a markdown file (the template's own note names -Pi as uncovered), rewrites that file as its frontmatter alone and drops the body; the prefix allow approves it with no prompt. This is the mistake recorded in pitfall 'Edit frontmatter with Edit or yq --front-matter=process'."
    evidence:
      basis: "review-lessons.md RL-005 symptom: 'A guard treats a tool as a read and denies its write forms with a regex denylist over flags or script text, so an unusual spelling ... still passes as a read; allowlist the read forms instead.' Retro 006 row: 'Regex denylists for a tool's write forms leak; allowlisting the read forms closed the class (D31).'"
      diff: "+ Bash(yq *--front-matter=extract* -i*) and + Bash(yq *-i* --front-matter=extract*), the first two of four new deny rules at template lines 147-150; the allow rule Bash(yq --front-matter=extract:*) at line 130 is unchanged"
    suggested_fix: "Replace the four text denies with an allowlist of the exact read forms the skills use (the read expression and a file operand, no flags), so any other yq --front-matter=extract call is prompted; apply the same change to .claude/settings.json and update the JRN-007 assertions in tests/scripts/install-claude-settings.sh, which pin the denylist."
  - id: RL-2
    category: discovered-work
    kind: bug
    summary: "check-worktree-scope.sh's read-only path matches the yq, find, git and rg write flags only when the flag follows an unquoted space, so a quoted flag such as '-i' or '-delete' passes as a read and runs from the main checkout without a cd. This is the RL-005 denylist class, and the lines are not changed by this diff."
    evidence: ".agents/skills/feature-workflow/scripts/check-worktree-scope.sh:201-205 (re_git_write, re_find_write, re_yq_write, re_jq_write, re_rg_exec) and :212-216 (the find, yq, jq and git case arms). Reasoned from the bash regex, not executed (the review runs read-only commands only): in yq '-i' '.a = 1' f.yaml the byte before the dash is a quote, so [[:space:]]- does not match and read_only_segment returns true; find . '-delete' takes the same route."
    blocker_assessment: can-wait
    reason: "Pre-existing and outside this change; the script's header calls the guard accident prevention, and a quoted-flag write still needs the agent to choose that spelling. Retro 006 says D31 closed this class, but these four tools are still denylisted, so that record and the guard disagree. Fixing it means allowlisting the read forms of yq, find, git and rg, which is a spec of its own."
