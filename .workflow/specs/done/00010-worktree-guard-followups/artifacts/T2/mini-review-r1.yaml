  - kind: "bug"
    summary: "Failures before CONFINED is set to 1 are not denied. The EXIT trap denies only once CONFINED is 1, so a non-zero exit at the workflow-paths.sh source (:72) or the stdin read (:74) lets the call through as a non-blocking error, which the sibling _guard-common.sh convention rules out."
    evidence: ".agents/hooks/worktree-write-guard.sh:56, :72, :74, :81"
    blocker_assessment: "can-wait"
    reason: "Pre-existing and untouched by this diff; reachable only with a partial install, where lib/ is missing while check-worktree-scope.sh exists."
  - kind: "bug"
    summary: "When the transcript is not valid JSON, jq stderr is discarded at :108 and the deny reason then says the transcript has no first user message, which sends the orchestrator to the wrong cause. The deny still happens, so item 3 passes."
    evidence: ".agents/hooks/worktree-write-guard.sh:108, :110"
    blocker_assessment: "can-wait"
    reason: "Only the cause text is wrong, and only for a malformed transcript."
