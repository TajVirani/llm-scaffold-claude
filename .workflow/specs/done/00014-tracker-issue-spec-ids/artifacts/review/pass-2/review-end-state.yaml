findings:
  - id: RE-1
    category: missing
    severity: medium
    confidence: 85
    location: ".agents/skills/issue-tracking/scripts/tracker-adoption.sh:333"
    claim: "Tracker adoption files an issue for each active spec but none for its tasks. An adopted spec already past 2.5 keeps task records with no `issue`. The step files then pass \"\" to `issue-tracker.sh move` at 3.3, 3.16, 3.9, 3.11 and 4.7. On a tracker project that call exits 2, and the convention says to stop."
    consequence: "A project that adopts the tracker partway through a spec stops at the next task launch (3.3), and the stop cannot be cleared: the step says to run the call again once it is fixed, but no step files the missing task issues. The adoption fixture's own 013-beta (T2 pending, no issue) is exactly this case. The stakeholder is stuck until someone runs create-task and set-task --issue by hand, and no step tells them to."
    evidence:
      basis: "spec.md CAP-NEW-issue-tracking-setup intent: 'on adoption file and rename every active spec ... so the tracker can be added at any time'. CAP-NEW-tracker-issues success: 'each task gets a GitLab child task ... or a GitHub sub-issue, recorded as `issue` in its task record'. task-breakdown.md 2.5 Done when: 'with a tracker every task record holds its `issue`'. conventions.md:33 'Tracker calls': '`<issue>` is the task record's `issue`, `\"\"` when null. On exit 1 or 2 stop, show the stakeholder its message and run it again once fixed.'"
      diff: "tracker-adoption.sh:349 '+    url=$(bash \"$ISSUE_TRACKER\" --cwd \"$MAIN\" create-spec) || tracker_status=$?' is its only issue-creating call. grep -n 'create-task\\|--issue' over tracker-adoption.sh and tests/scripts/tracker-adoption.sh finds nothing. create-task appears only at task-breakdown.md:106 (2.5) and discovery-impact.md:48 (0.3.20), and neither runs again for an adopted spec. tests/fixtures/tracker-adoption.sh:149-161 gives 013-beta, in progress, the task 'T2 status: pending' with no issue."
      reproduction: "Scratch repo with origin https://github.com/acme/widget.git, .workflow/issue-tracking.yaml naming github with three flow labels, and a logging fake gh on PATH: `issue-tracker.sh move \"\" in_progress` (the 3.3 call for a task whose issue is null) -> 'issue-tracker.sh: not an https issue URL ending in its number: ' exit=2, and the gh log stays empty (0 lines)."
    suggested_fix: "In adoption, for each adopted spec, run create-task and set-task --issue for every task record without an issue that is not split-out, after the spec's issue is filed. Or make 3.3 file a missing task issue before the move. Add a JRN-011 case on 013-beta's tasks."
