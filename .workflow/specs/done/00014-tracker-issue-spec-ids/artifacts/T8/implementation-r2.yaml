considered_not_built:
  - "Committing the main checkout's renames: wf_rewrite_commit refuses the main branch and the workflow never commits to main directly, so the Done renames, the draft renames and the reference rewrites are left in the main checkout's working tree and the script prints a not-committed line asking for a branch and merge."
  - "Renaming Done folders or rewriting Done references inside spec worktrees: each spec branch picks up the old_ renames when it merges main; rewriting them on the branch would point its links at folders it does not have yet."
  - "Renaming existing local task branches (task/OLD/...): only the task records' branch fields are renamed, as the task asks; old task branches and their PRs stay as they are, like the old remote spec branch."
  - "Renaming older work-backlog items NAME-disc-*.md of a Done spec: the shared rewrite does not rewrite references to them, so renaming would break their links; they are closed items of finished specs."
  - "Adding the Tracker issue Links line to spec.md: that line is an authoring convention for the spec writer; the script writes only the tracker_issue key."
  - "Refusing a done spec still at the top level of the specs folder: it is treated as active like the others; nothing in the task or the fixture covers it."
  - "A test for a failing fill: the fakes can only fail every call at once, which stops create-spec first, so the fill-failure branch is covered by reading, not by a test."
