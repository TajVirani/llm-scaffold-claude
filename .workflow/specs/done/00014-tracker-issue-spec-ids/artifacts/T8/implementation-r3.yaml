status: done
summary: "tracker-adoption.sh now files a task issue (issue-tracker.sh create-task) for each task record of an adopted spec that has no issue and is not split-out, and records it through status-transition.sh set-task before the rename, so the spec-worktree rename commit carries it and a rollback keeps it as it keeps tracker_issue. A rerun skips tasks that already hold an issue, including on an already-adopted spec. A task issue the tracker cannot file, or one that cannot be recorded, is reported with the commands to finish it by hand, and the run exits 1. The fixture's task records gained the fields the tasks.md validator requires (capability, depends_on, touches_core, work_type, file), plus task files and a split-out T3."
