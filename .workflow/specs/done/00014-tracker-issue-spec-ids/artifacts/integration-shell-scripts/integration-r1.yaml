    interface: "Functions in .agents/lib/workflow-paths.sh. They return 1 with the reason on stderr and never exit. Their state is in WF_REWRITE_* variables, so call them in the script's own shell, never inside $(...). wf_rewrite_begin ROOT; wf_rewrite_checkout_refusal ROOT MAIN_BRANCH (prints the refusal reason for a detached HEAD, MAIN_BRANCH checked out, or a merge/cherry-pick/revert in progress; prints nothing when the commit may go ahead; status 1 only when git cannot be read; call it before the first change); wf_rewrite_move OLD NEW (repo-relative; creates NEW's missing parent folders; queues NEW, and OLD when tracked); wf_rewrite_set_aside FILE (moves an untracked local file such as .step into the temp folder); wf_rewrite_spec_path OLD NEW (each $WF_SPECS/NAME or $WF_SPECS_DONE/NAME; rewrites the specs/<part> forms, the ../ climb form for files under the specs folder, and when NAME changes the work-backlog/NAME.md and NAME.md#B<n> references, in tracked plus untracked-not-ignored files under WF_DIR, skipping cache, initiatives, .worktrees, .spec-worktrees, .handoff and both staging folders; when NEW is one level deeper and already moved, adds one ../ to the links that leave it; refuses a move up out of the Done folder); wf_rewrite_commit MAIN_BRANCH SUBJECT BODY [PATH...] (checks the checkout again, then commits only the queued paths plus PATH...; BODY '' means no body); wf_rewrite_pending; wf_rewrite_roll_back (undoes changes newest first, index included; status 1 with the leftover items in the WF_REWRITE_LEFT array, and the temp folder kept); wf_rewrite_end. Callers keep their own messages: move-to-done.sh prints 'rolled back' or 'rollback incomplete' from its EXIT trap. The main branch is passed in because shared core may not call rules-setting.sh."
    awaiting_contract: []
    tests: ["tests/scripts/lib-workflow-paths.sh: a rename to a new number, an old_ rename in the Done folder and a move into it commit in one run (plus content checks for every reference form, look-alikes, cache/initiatives/docs untouched, the exact commit path list, message, pre-staged change kept staged, step marker kept)", "tests/scripts/lib-workflow-paths.sh: a commit with an empty body and an extra path commits the queued paths and that path, subject only", "tests/scripts/lib-workflow-paths.sh: the rollback puts every moved folder, rewritten file, set-aside step marker back and removes the folders it created", "tests/scripts/lib-workflow-paths.sh: the rollback after a failing commit restores the index, the tree and HEAD", "tests/scripts/lib-workflow-paths.sh: a rollback that cannot restore a file returns 1, names it and how to restore it, and keeps the copy", "tests/scripts/lib-workflow-paths.sh: wf_rewrite_checkout_refusal (spec branch, main, detached HEAD, merge in progress, outside git)", "tests/scripts/lib-workflow-paths.sh: wf_rewrite_commit on the main branch returns 1 naming it, commits nothing, and the rollback restores the tree", "tests/scripts/lib-workflow-paths.sh: the path rewrite refuses (up move, non-spec, nested, backlog folder, same folder, existing target, missing source, second run, calls before wf_rewrite_begin)"]
