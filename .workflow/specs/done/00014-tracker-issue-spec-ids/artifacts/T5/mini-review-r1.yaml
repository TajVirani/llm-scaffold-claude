out_of_scope_noticed:
  - kind: "bug"
    summary: "On GitLab, a failed child-task GraphQL call that is not a refusal (for example a timeout) is reported as a refusal, and the task is filed as a linked issue with exit 0. SKILL.md says a tracker failure exits 1."
    evidence: "Probe: a fake glab that fails every graphql call with 'dial tcp: i/o timeout' and answers the REST calls. Command: issue-tracker.sh create-task https://gitlab.com/grp/proj/-/issues/42 task.md. Output: stderr 'issue-tracker.sh: GitLab refused a child task under issue #42, so the task gets an issue linked to it instead: dial tcp: i/o timeout'; stdout 'https://gitlab.com/grp/proj/-/issues/9'; exit=0. Rule: .agents/skills/issue-tracking/SKILL.md:24 'Exit 1: the tracker failed, for example the network or the login.'"
    blocker_assessment: "blocks-this-task"
    reason: "The fallback at .agents/skills/issue-tracking/scripts/issue-tracker.sh:275-283 and create_child_task (225-250) are added by this diff. The fallback should run only on GitLab's own refusal in the response; a transport failure should exit 1 with glab's message."
