considered_not_built:
  - "Sharing the settings check with next-spec-number.sh: a shared copy belongs in .agents/lib/, which is shared core, so a local copy stays."
  - "A gh version check before --parent: tracker-setup.sh check owns the minimum version; an older gh fails on the unknown flag with its own message and exit 1."
  - "Checking that an issue URL belongs to the origin project: the CLIs resolve the project from the project root; the URL only supplies the issue number."
  - "Setting the GitLab child task's label through the GraphQL labels widget: that needs label global ids; a REST add_labels call after the create does the same job."
  - "Treating a GraphQL answer that is not JSON at all as a refusal: it is not GitLab refusing, so it exits 1 naming the answer instead of filing a linked issue."
