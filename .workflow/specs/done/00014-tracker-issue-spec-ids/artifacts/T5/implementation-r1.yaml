considered_not_built:
  - "Sharing the settings check with next-spec-number.sh: the same check now lives in both scripts. A shared copy belongs in .agents/lib/, which is shared core, so I kept a local copy rather than widen the task."
  - "A gh version check before --parent: tracker-setup.sh check owns the minimum version. An older gh fails on the unknown flag, which exits 1 with gh's own message."
