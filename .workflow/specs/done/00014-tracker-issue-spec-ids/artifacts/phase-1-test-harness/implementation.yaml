status: done
summary: "Phase 1 harness for spec 00014. Harness command: tests/run-all.sh (one suite: tests/run-all.sh --suite <name>). CI check name: none, because this repo has no CI. Six new suites: scripts/next-spec-number (JRN-001), scripts/issue-tracking (JRN-001 skip, JRN-002 to JRN-008), scripts/issue-tracking-setup (JRN-010), scripts/tracker-adoption (JRN-011, JRN-012 backlog lookup), lint/issue-tracking-docs (JRN-001 0.1.1 call, JRN-005, JRN-006 breakdown calls, JRN-007, JRN-014) and lint/shared-tracker-logic (JRN-013). New tests in five existing suites: status-transition-tasks (JRN-006 set-task --issue), lib-workflow-paths, review-lessons and check-write-paths (JRN-012 old_ names), and sign-off-pr (JRN-009). Fixtures: tests/fixtures/fake-trackers.sh, tests/fixtures/tracker-adoption.sh, and an extended tests/fixtures/pr-template.sh. Interface stubs: next-spec-number.sh, issue-tracker.sh, tracker-setup.sh and tracker-adoption.sh. Suites failing at the base commit: none (75 suites, 4458 passed, 0 failed). After this work: 81 suites, 4470 passed, 161 failed. The 11 failing suites are exactly the 6 new ones and the 5 extended ones, and only the new tests in them fail, each on an assertion; every pre-existing pass count is unchanged. JRN-015 and JRN-016 are left to their existing checks. Not added as separate tests because they already pass at the base: a no-tracker stub body passing check-pr-body.sh (covered by scripts/check-pr-body), the usage exit 2 for an unknown option or no command, and --issue being refused in status mode. Choices the orchestrator should know about. (1) set-task --issue with a non-URL is pinned to exit 2, as the JRN-006 journey row says. The stub contract says 'like --pr', and --pr exits 1 for a non-URL. (2) tracker-setup.sh check is pinned only to the host as its first line. The missing-label lines are not pinned, because check receives no label names in the contract. (3) Adoption is pinned to write tracker_issue on each adopted spec, because later move calls need the issue URL. (4) lint/shared-tracker-logic expects the shared lib functions to have host and rewrite in their names. (5) The docs lint also requires the next-spec-number.sh call at 0.1.1 and create-task plus set-task --issue at 2.5 and 0.3.20, beyond the brief's list. (6) Phase 3 must move tests/scripts/move-to-done.sh:343-372, tests/scripts/spec-worktree.sh:85-90 and tests/fixtures/initiative.sh next_spec_number off the 0.1.1 fenced scan block once 0.1.1 becomes one call. (7) One exploratory git ls-remote I ran in my scratch folder, not in the harness, reached gitlab.com once and failed on auth. The harness blocks this with GIT_ALLOW_PROTOCOL=file in fake_run and in the fixture pushes."
