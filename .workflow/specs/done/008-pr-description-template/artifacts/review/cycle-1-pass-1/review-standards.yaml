findings:
  - id: RS-1
    category: standard
    severity: medium
    confidence: 85
    location: ".agents/skills/feature-workflow/assets/pr-template.md:16-17"
    claim: "The shipped PR template tells every project to publish a stub line naming .workflow/deferred/spec-issue-creation.md, a shelf file that exists only in this scaffold repo's own .workflow/."
    consequence: "assets/ is installed into every target project (install-manifest lists skills/feature-workflow). There, each Sign-off PR/MR description published at 5.8 cites a file that does not exist, so reviewers in those projects follow a dead pointer. The scaffold repo's own state also leaks into the distributed payload."
    evidence:
      basis: "AGENTS.md 'Two trees': 'Keep the two roles apart: a change to how the workflow behaves goes in `.agents/`; a fact about this repo (its rules, profiles, decisions) goes in `.workflow/`.' Also writing-for-agents SKILL.md Finish (required by .workflow/profiles/agent-docs.md): 'every path it names exists.'"
      diff: "+<!-- The tracker issue this spec delivers, as a URL. Until the workflow creates issues, use this fixed stub line:\n+No tracker issue yet: creating one when a spec starts is shelved in .workflow/deferred/spec-issue-creation.md. -->"
    suggested_fix: "Make the stub line project-neutral (e.g. 'No tracker issue yet: the workflow does not create one when a spec starts.'). Keep the pointer to the shelf item in this repo's own deferred file and design log, not in the shipped asset."
  - id: RS-2
    category: standard
    severity: medium
    confidence: 82
    location: ".agents/skills/feature-workflow/modules/sign-off.md:32; .agents/skills/project-setup/modules/files.md:32"
    claim: "Two modules each spell out the list of host PR/MR template paths: sign-off 5.2 and project-setup's PR template step."
    consequence: "project-setup (at setup) and sign-off 5.2 (at every later spec) must find the same host templates. If one list is edited, for example to add GitHub's root or docs/ template locations, the other drifts. Setup then asks about a template that 5.2 never proposes, or 5.2 proposes one that setup ignored. project-setup/SKILL.md already avoids this by pointing at files.md."
    evidence:
      basis: ".workflow/profiles/agent-docs.md: 'follow the `writing-for-agents` skill'; writing-for-agents SKILL.md Pruning: 'Single source of truth: each meaning lives in one place. Duplication costs maintenance and tokens and inflates a meaning's rank.'"
      diff: "+- The key is unset (... ) and the repo has a host PR/MR template at one of these paths only: `.github/pull_request_template.md`, `.github/PULL_REQUEST_TEMPLATE.md`, `.github/PULL_REQUEST_TEMPLATE/*.md`, `.gitlab/merge_request_templates/*.md`."
    suggested_fix: "Keep the path list in one place, either sign-off.md 5.2 or project-setup files.md. project-setup may depend on feature-workflow and feature-workflow on project-setup, so the other file can point at it, the way project-setup/SKILL.md step 3 already does."
  - id: RS-3
    category: discovered-work
    kind: decision
    summary: "The glossary still defines the PR template as 'The fixed sections a Sign-off PR description must fill' and says each Sign-off PR's 'description follows the PR template'. With this change, a pr_template path makes the Sign-off PR follow the host template's headings, and 'the ten workflow sections are not added'. The glossary no longer matches what sign-off does."
    evidence: ".workflow/GLOSSARY.md:148, :152, :186 against .agents/skills/feature-workflow/modules/sign-off.md 5.4 step 2 ('A path: fill that host template's own `##` headings ...; the ten workflow sections are not added')."
    blocker_assessment: can-wait
    reason: "Behaviour is correct and the design log's term gate kept 'host template' as plain prose. The glossary is Tier A data, changed only through a 5.2 Decisions/glossary proposal approved at 5.3. That is the natural place to qualify the Sign-off PR and PR template entries, and it needs no code change now."
