# Codex project config fragment for the workflow 2.0 scaffold. install.sh merges it into <target>/.codex/config.toml.
#
# - [tui] status_line: the context bar, on by default. Codex has no custom-command status line, only built-in item IDs
#   (openai/codex codex-rs/tui/src/bottom_pane/status_line_setup.rs). install.sh writes [tui] in its own marker block, and
#   keeps a [tui] table the user already has (with a warning). Whether a project-level .codex/config.toml [tui] is honoured is
#   unverified live.

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]
